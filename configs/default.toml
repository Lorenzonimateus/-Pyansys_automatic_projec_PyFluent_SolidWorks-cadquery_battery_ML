# Parametric CFD pipeline: SolidWorks -> SpaceClaim -> Fluent Meshing -> Fluent -> ML.
# Relative paths are resolved from the folder the command is run in.
# Every value can be overridden with --set section.name=value (or OVERRIDES in main.py).

[paths]
output_dir = "output"
sldprt = "inputs/geometria_parametrizada.SLDPRT"
mesh_workflow = "inputs/geometria_parametrizada_9_cells_workflow_files/geometria_parametrizada_9_cells.wft"
base_case = "inputs/geometria_parametrizada_9_cells.cas.h5"

# SolidWorks global variables (Tools > Equations), in mm. Only the variables listed
# here are changed; all the others keep the value saved in the .SLDPRT.
# NOTE: "H" (70.15) exists in the part but no dimension uses it (the extrusions have
# a fixed 70.15), so changing H does nothing until it is linked in SolidWorks.
[cad]
D = 21.55      # cell diameter           -> D7@Sketch6
L1 = 10.0      #                          -> D3@Sketch6
P1 = 10.0      #                          -> D9@Sketch6

# SpaceClaim (batch, no GUI): opens the rebuilt .SLDPRT and recreates the named
# selections of the fluid body's faces at the ends of the flow axis.
[spaceclaim]
exe = "C:/Program Files/ANSYS Inc/v252/scdm/SpaceClaim.exe"
timeout_s = 900
fluid_body = "volume"
flow_axis = "x"
inlet_name = "inlet"       # face at the minimum of flow_axis
outlet_name = "output"     # face at the maximum of flow_axis

# Fluent Meshing: the saved watertight workflow (.wft) is replayed on the new
# geometry; only these values are changed in it.
[mesh]
processors = 16
min_size_mm = 0.3
max_size_mm = 3.0
hex_max_size_mm = 2.4
bl_layers = 5

# Fluent: the base case is read, its mesh replaced, and these named expressions
# (input parameters of the case) are set. Values in the unit written next to them.
[fluent]
parameter_velocity_inlet = 3.0            # m/s
parameter_heat_source_wperm3 = 40400.0    # W/m^3

[fluent_units]
parameter_velocity_inlet = "m/s"
parameter_heat_source_wperm3 = "W/m^3"

# Battery operating point -> heat source of the Fluent case (like the P50B project).
# Heat per cell Q = (c_rate * capacity_ah)^2 * r_dc_ohm  [W]
# Fluent input  q = Q / V_cell  [W/m^3],  V_cell = pi (D/2)^2 * cell_height
# D is read from `diameter` (the cad parameter), so q follows the geometry.
# The value of [fluent] parameter_heat_source_wperm3 is then COMPUTED, not read:
# vary operating.c_rate in the study, not the heat source.
[operating]
c_rate = 1.8                 # nominal; 1.8C ~ 4.04e4 W/m^3 of the base case (D = 21.55)
capacity_ah = 5.0
r_dc_ohm = 0.0128            # DC resistance at 50% SOC (Molicel P50B datasheet)
cell_height_mm = 70.15       # extrusion height of the cells in the part
diameter = "cad.D"
heat_source = "parameter_heat_source_wperm3"

[solver]
processors = 16
mpi = "intel"              # "" for Fluent's default MPI
start_timeout_s = 300
# Report definitions of the base case that are read after each run.
# PyFluent ALWAYS returns them in SI (temperature in K, pressure in Pa), whatever
# units are selected in the Fluent GUI (the case shows °C, the API still gives K).
reports = ["t_max", "t_min", "t_avg", "t_out", "p_in", "p_out", "m_out"]
# Convergence: the reports are sampled every sample_every iterations; after each
# block of check_every iterations, the block AVERAGE of each monitored report is
# compared with the previous block (the flow behind the cells keeps a small
# oscillation that never dies out, but its mean settles).
# Results = average over the last average_window iterations; the relative
# oscillation of each monitored report is saved as <name>_osc.
monitor = ["t_max", "p_in"]
min_iterations = 200
max_iterations = 500
check_every = 50
sample_every = 10
rel_tol = 2e-3             # max |change| / |value| of the block averages
average_window = 200
save_case_data = true

# Outputs derived from the reports (numpy expressions over the report names).
# They become columns of results.csv and can be used by the study, ML and optimizer.
# Temperatures: the reports are in K (see above), so -273.15 gives °C always.
[outputs]
T_max_C = "t_max - 273.15"
T_avg_C = "t_avg - 273.15"
dT_cells_K = "t_max - t_min"
dP_Pa = "p_in - p_out"
T_out_C = "t_out - 273.15"

# Contour images of each solved point on the three mid-planes of the domain
# (xy at z_mid, yz at x_mid, xz at y_mid). Temperature always in °C, pressure in
# Pa (gauge), velocity in m/s. Saved as <field>_<plane>.png in
#   output/studies/<name>/images/dpNNN/   and   output/single/images/<case>/
[images]
enabled = true
fields = ["temperature", "pressure", "velocity"]
planes = ["xy", "yz", "xz"]
dpi = 150
# Fixed color ranges make the images of different points comparable; leave a
# field out to scale each image to its own min/max. Units as in the images.
# ranges = { temperature = [20.0, 40.0], velocity = [0.0, 8.0] }

# Physical fields for Machine Learning (CNN / U-Net): for each point and plane,
# a .npz with T [°C], p [Pa] and U [m/s] as float32 on a FIXED regular grid (same
# domain and resolution for every case), the same fields normalized with FIXED
# limits, the fluid mask, the signed distance function and the parameter vector.
# Saved in output/studies/<name>/ml_fields/<plane>/dpNNN.npz (+ normalization.json).
[ml_fields]
enabled = true
planes = ["xy", "yz", "xz"]
# Grid bounds in mm: must contain the domain of EVERY geometry of the study.
# With D = 22 and L1, P1 in [2, 10]: x 0..303-309.4, y 0..70.15, z -73.6..-100.8 to 0.
x_mm = [0.0, 330.0]
y_mm = [0.0, 70.15]
z_mm = [-110.0, 0.0]
resolution = [256, 64, 128]      # points along x, y, z (xz plane = 256 x 128)

# Fixed limits for the WHOLE dataset (never per image): value -> (v - min)/(max - min).
# A warning is logged when a case goes outside them. Units: °C, Pa, m/s.
# Up to 10C (32 W per cell) at 1 m/s the cells can pass 150 °C in steady state;
# after the study, tighten the limits to the data and run `postprocess`.
[ml_fields.normalization]
temperature = [20.0, 250.0]
pressure = [-200.0, 300.0]
velocity = [0.0, 30.0]

# Design of experiments (LHS). Parameter names are "section.name".
# cad.* and mesh.* change the geometry/mesh (one mesh per distinct geometry);
# fluent.* and operating.* only change the Fluent inputs and reuse the mesh.
# [min, max] = sampled range;  [value] = fixed for the whole study (not sampled).
[study]
name = "doe_crate"
samples = 40
seed = 42
outputs = ["T_max_C", "dT_cells_K", "dP_Pa"]

[study.parameters]
"cad.D" = [22.0]
"cad.L1" = [2, 10]
"cad.P1" = [2, 10]
"operating.c_rate" = [1.0, 10.0]
"fluent.parameter_velocity_inlet" = [1.0, 7.0]

# Surrogate-based optimization: Gaussian process + expected improvement.
# Each iteration picks the most promising point, runs it in CFD, adds it to
# results.csv and retrains, so the surrogate improves where it matters.
[optimize]
objective = "T_max_C"
sense = "min"                        # "min" or "max"
constraints = ["dP_Pa <= 25"]        # "<output> <= value" or "<output> >= value"
iterations = 8
seed = 0
